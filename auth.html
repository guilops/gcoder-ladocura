<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff9f5">
  <meta name="robots" content="noindex, nofollow"><title>Minha conta | La Docura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="bakery auth-page">
  <header class="site-header"><a class="bakery-brand" href="./"><img class="bakery-logo" src="assets/bakery/la-docura-logo.png" alt="La Docura Confeitaria Gourmet"><span><strong>La Docura</strong><small>CONFEITARIA GOURMET</small></span></a><a class="text-link" href="./">Voltar à vitrine ↗</a></header>
  <main class="auth-main"><section class="auth-card"><span class="aside-flower">✿</span><p class="eyebrow"><span></span> LA DOCURA CONFEITARIA</p><h1 id="auth-title">Crie sua conta</h1><p class="auth-intro">Entre ou cadastre-se com seu e-mail.</p>
    <form id="auth-form"><label id="name-field">Seu nome<input name="name" autocomplete="name" minlength="2" maxlength="100" required placeholder="Seu nome"></label><label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="voce@email.com"></label><label>Senha<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label><p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></p><button id="auth-submit" class="button button-dark" type="submit">Criar conta</button></form>
    <section id="auth-session" class="auth-session" hidden><p class="auth-session-state">Sessão ativa</p><strong id="auth-user-email"></strong><small id="auth-user-id"></small><button id="auth-signout" class="button button-outline" type="button">Sair da conta</button></section>
    <p class="auth-switch"><span id="auth-switch-copy">Já tem uma conta?</span> <button id="auth-switch" type="button">Entrar</button></p>
  </section></main>
  <script src="config.js"></script><script type="module" src="auth-client.js"></script>
</body></html>
